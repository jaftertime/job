<h1> HTML model example </h1>
<h2> if/else </h2>
<h3> Now time is {{ time }}. </h3>
{% if clock >= 22 %}
    <h3> The time is night! </h3>
{% elif clock >= 18 %}
    <h3> The time is evening! </h3>
{% elif clock >= 6 %}
    <h3> The time is daytime! </h3>
{% else %}
    <h3> The time is dawn! </h3>
{% endif %}
